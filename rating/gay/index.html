<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse-Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        #quiz-container {
            background-color: #262626;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        h2 { margin-bottom: 1.5rem; color: #ffd700; }

        .options {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-option { background-color: #444; color: white; }
        .btn-option.selected { background-color: #ffd700; color: #000; }

        #next-btn {
            background-color: #ffd700;
            color: #000;
            width: 100%;
            font-size: 1.1rem;
        }

        #next-btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Ergebnis-Status */
        body.result-mode { background-color: #ff69b4; }
        .result-text { font-size: 1.5rem; font-weight: bold; color: white; }
        #countdown { font-size: 3rem; margin-top: 1rem; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="question-section">
        <h2 id="question-text">Frage 1</h2>
        <div class="options">
            <button class="btn-option" onclick="selectOption(this)">Ja</button>
            <button class="btn-option" onclick="selectOption(this)">Nein</button>
        </div>
        <button id="next-btn" onclick="nextStep()" disabled>Weiter</button>
    </div>

    <div id="countdown-section" class="hidden">
        <h2>Analyse läuft...</h2>
        <div id="countdown">5</div>
    </div>

    <div id="result-section" class="hidden">
        <div class="result-text">Christoph Schuster ist zu 99,9% Schwul</div>
    </div>
</div>

<script>
    let currentStep = 1;
    const questions = [
        "Kennt Christoph Schuster aktuelle Modetrends?",
        "Ist Christoph Schuster besonders gepflegt?",
        "Hat Christoph Schuster einen ausgeprägten Sinn für Ästhetik?",
        "Ist Christoph Schuster oft freundlich und hilfsbereit?",
        "Analysiere finale Parameter für Christoph Schuster?"
    ];

    function selectOption(btn) {
        document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('next-btn').disabled = false;
    }

    function nextStep() {
        if (currentStep < 5) {
            currentStep++;
            document.getElementById('question-text').innerText = questions[currentStep - 1];
            document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
            document.getElementById('next-btn').disabled = true;
            
            if (currentStep === 5) {
                document.getElementById('next-btn').innerText = "Zum Ergebnis";
            }
        } else {
            startCountdown();
        }
    }

    function startCountdown() {
        document.getElementById('question-section').classList.add('hidden');
        document.getElementById('countdown-section').classList.remove('hidden');
        
        let timeLeft = 5;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                showResult();
            }
        }, 1000);
    }

    function showResult() {
        document.body.classList.add('result-mode');
        document.getElementById('countdown-section').classList.add('hidden');
        document.getElementById('result-section').classList.remove('hidden');
    }
</script>

</body>
</html>
