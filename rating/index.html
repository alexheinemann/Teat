<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #000000;
            --accent-color: #000000;
            --border-color: #eeeeee;
            --rating-bg: #f5f5f5;
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #111111;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --border-color: #222222;
            --rating-bg: #1c1c1c;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto 30px auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0;
            text-transform: uppercase;
        }

        .theme-switch {
            cursor: pointer;
            padding: 8px 15px;
            border-radius: 4px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.8em;
            font-weight: bold;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 40px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        .category-item {
            margin-bottom: 20px;
        }

        .category-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rating-scale {
            display: flex;
            gap: 5px;
        }

        .rating-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--rating-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .rating-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .chart-container {
            position: sticky;
            top: 20px;
            height: 550px; /* Deutlich vergrößert */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Muscle Review 2026</h1>
        <button class="theme-switch" onclick="toggleTheme()">🌓 Mode wechseln</button>
    </div>

    <div class="container">
        <!-- Input Bereich -->
        <div id="inputs" class="input-section">
            <!-- Kategorien via JS -->
        </div>

        <!-- Chart Bereich -->
        <div class="chart-container">
            <canvas id="muscleChart"></canvas>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 
            'Bizepsumfang', 'Schulterbreite', 'Waden',
            'Definition (KFA)', 'Vaskularität', 'Pumpgefühl', 'Regeneration'
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        function toggleTheme() {
            const body = document.documentElement;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            updateChartTheme(newTheme);
        }

        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale" data-cat="${index}">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(catIndex, value, btn) {
            scores[catIndex] = value;
            const parent = btn.parentElement;
            parent.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            myChart.data.datasets[0].data = scores;
            myChart.update();
        }

        function initChart(theme = 'light') {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            const isDark = theme === 'dark';
            
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        label: 'Dein Profil',
                        data: scores,
                        backgroundColor: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)',
                        borderColor: isDark ? '#ffffff' : '#000000',
                        pointBackgroundColor: isDark ? '#ffffff' : '#000000',
                        borderWidth: 1.5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0,
                            max: 5,
                            ticks: { display: false, stepSize: 1 },
                            grid: { color: isDark ? '#333333' : '#eeeeee' },
                            angleLines: { color: isDark ? '#333333' : '#eeeeee' },
                            pointLabels: {
                                color: isDark ? '#ffffff' : '#000000',
                                font: { size: 11, weight: '600', family: 'Inter' }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChartTheme(theme) {
            const isDark = theme === 'dark';
            myChart.options.scales.r.grid.color = isDark ? '#333333' : '#eeeeee';
            myChart.options.scales.r.angleLines.color = isDark ? '#333333' : '#eeeeee';
            myChart.options.scales.r.pointLabels.color = isDark ? '#ffffff' : '#000000';
            myChart.data.datasets[0].borderColor = isDark ? '#ffffff' : '#000000';
            myChart.data.datasets[0].backgroundColor = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
            myChart.update();
        }

        initChart();
    </script>
</body>
</html>
