<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #fcfcfc;
            --text-color: #1a1a1a;
            --accent-color: #d4af37;
            --border-color: #eeeeee;
            --rating-bg: #f5f5f5;
            --flash-color: rgba(255, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #ffffff;
            --accent-color: #ffca28;
            --border-color: #222222;
            --rating-bg: #1c1c1c;
            --flash-color: rgba(255, 0, 0, 0.6);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            align-self: center;
        }

        /* ANIMATIONEN */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-12px); }
            50% { transform: translateX(12px); }
            75% { transform: translateX(-12px); }
            100% { transform: translateX(0); }
        }

        @keyframes flashRed {
            0%, 33%, 66%, 100% { background-color: transparent; }
            15%, 48%, 82% { background-color: var(--flash-color); }
        }

        .shake-effect { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .flash-effect { animation: flashRed 0.8s ease-in-out; }

        .step { display: none; width: 100%; }
        .step.active { display: block; }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 { 
            color: var(--accent-color); 
            text-transform: uppercase; 
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin: 0;
        }

        .theme-switch {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 40px;
            margin-bottom: 50px;
            text-align: left;
        }

        .category-label { 
            display: block; 
            margin-bottom: 12px; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 0.05em;
            opacity: 0.9; 
        }
        
        .rating-scale { display: flex; gap: 8px; }
        .rating-btn {
            flex: 1; padding: 18px; border: 1px solid var(--border-color);
            background: var(--rating-bg); color: var(--text-color);
            border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .rating-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        .result-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .insult-box {
            padding: 20px; border: 1px solid var(--accent-color);
            border-radius: 12px; margin: 20px 0; font-style: italic;
            color: var(--accent-color); font-size: 1.1rem; line-height: 1.5;
            background: rgba(212, 175, 55, 0.05);
            width: 95%;
        }

        .chart-container { width: 100%; aspect-ratio: 1/1; max-width: 450px; margin: 20px 0; }

        .primary-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 20px; border-radius: 12px; font-weight: 900;
            text-transform: uppercase; width: 100%; max-width: 400px; cursor: pointer; 
            margin-top: 15px; font-size: 1rem; letter-spacing: 1px;
        }

        .secondary-btn {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-color); padding: 14px; border-radius: 12px;
            width: 100%; max-width: 400px; cursor: pointer; margin-top: 12px; font-size: 0.8rem;
        }

        .legend-mini { font-size: 1rem; margin-bottom: 35px; font-weight: bold; opacity: 0.6; }
        
        /* Overlay für den Flash-Effekt */
        #flashOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="flashOverlay"></div>

    <div class="container" id="mainContainer">
        <div class="header-nav">
            <div style="width: 80px;"></div>
            <button class="theme-switch" onclick="toggleTheme()">🌓 Mode</button>
        </div>

        <!-- SCHRITT 1: EINGABE -->
        <div id="step1" class="step active">
            <h1>Muscle Review 2026</h1>
            <div class="legend-mini">1 = LAPPEN | 5 = MR. OLYMPIA</div>
            <div id="inputs" class="category-grid"></div>
            <button class="primary-btn" onclick="triggerAnalyse()">Analyse starten</button>
        </div>

        <!-- SCHRITT 2: ERGEBNIS -->
        <div id="step2" class="step">
            <div class="result-view">
                <h1>Dein persönliches Versagen</h1>
                <div id="insult" class="insult-box"></div>
                
                <div class="chart-container">
                    <canvas id="muscleChart"></canvas>
                </div>

                <button class="primary-btn" onclick="downloadChart()">Als .png speichern</button>
                <button class="secondary-btn" onclick="location.reload()">Werte korrigieren</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 'Bizeps', 
            'Schulter', 'Waden', 'Definition', 'Vaskularität', 
            'Pump', 'Regeneration'
        ];

        const insults = [
            "Dein Trainingsplan ist wohl eher ein Malbuch. Geh endlich schwer trainieren.",
            "Physikalisches Gesetz: Wo kein Widerstand, da kein Muskel. Fang mal damit an.",
            "Dein Körperbau erinnert an ein dezent geformtes Stück Weißbrot. Mehr Eisen!",
            "Süß, dass du das Sport nennst. Ich nenne es 'Stehen mit Gewichten'.",
            "Die Grafik sieht aus wie ein verhungertes Spinnennetz. Geh pumpen.",
            "Bist du im Gym zum Trainieren oder um die Klimaanlage zu testen?",
            "Deine Vaskularität ist so vorhanden wie deine Disziplin: Gar nicht.",
            "Glückwunsch zum stabilsten Lappen-Status 2026. Beweg deinen Arsch.",
            "Das Einzige, was hier massiv ist, ist deine Ignoranz gegenüber schweren Sätzen.",
            "Stopp die Ausreden. Fang an zu fressen und zu heben. Mehr trainieren!"
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(idx, val, btn) {
            scores[idx] = val;
            btn.parentElement.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function triggerAnalyse() {
            const container = document.getElementById('mainContainer');
            const overlay = document.getElementById('flashOverlay');
            
            // 1. Shake
            container.classList.add('shake-effect');
            
            // 2. Flash (kurz verzögert für maximale Wirkung)
            setTimeout(() => {
                overlay.classList.add('flash-effect');
            }, 100);

            // 3. Seitenwechsel nach Animation
            setTimeout(() => {
                showResults();
                container.classList.remove('shake-effect');
                overlay.classList.remove('flash-effect');
            }, 900);
        }

        function showResults() {
            window.scrollTo(0,0);
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('insult').innerText = insults[Math.floor(Math.random() * insults.length)];
            initChart();
        }

        function initChart() {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const accent = isDark ? '#ffca28' : '#d4af37';

            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        data: scores,
                        backgroundColor: isDark ? 'rgba(255, 202, 40, 0.2)' : 'rgba(212, 175, 55, 0.2)',
                        borderColor: accent,
                        pointBackgroundColor: accent,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 5,
                            ticks: { display: false, stepSize: 1 },
                            grid: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)' },
                            angleLines: { color: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)' },
                            pointLabels: { color: isDark ? '#fff' : '#1a1a1a', font: { size: 11, weight: '700' } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function toggleTheme() {
            const body = document.documentElement;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            if (myChart) initChart();
        }

        function downloadChart() {
            const name = prompt("Name des Athleten:", "Lappen");
            if (!name) return;
            const originalCanvas = document.getElementById('muscleChart');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            
            tempCanvas.width = 800; tempCanvas.height = 1000;
            tempCtx.fillStyle = isDark ? '#0a0a0a' : '#ffffff';
            tempCtx.fillRect(0, 0, 800, 1000);
            tempCtx.fillStyle = isDark ? '#ffca28' : '#d4af37';
            tempCtx.font = '900 50px sans-serif';
            tempCtx.textAlign = 'center';
            tempCtx.fillText('MUSCLE REVIEW 2026', 400, 100);
            tempCtx.fillStyle = isDark ? '#fff' : '#1a1a1a';
            tempCtx.font = '30px sans-serif';
            tempCtx.fillText('Athlet: ' + name, 400, 160);
            tempCtx.drawImage(originalCanvas, 100, 300, 600, 600);
            const link = document.createElement('a');
            link.download = `Review_${name}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
