<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --text-color: #000000;
            --accent-color: #000000;
            --border-color: #eeeeee;
            --rating-bg: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --border-color: #222222;
            --rating-bg: #151515;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            transition: background 0.3s ease;
        }

        .header-section {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0;
        }

        .theme-switch {
            cursor: pointer;
            background: var(--rating-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 60px;
        }

        @media (max-width: 1000px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .category-item {
            margin-bottom: 25px;
        }

        .category-label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .rating-scale {
            display: flex;
            gap: 5px;
        }

        .rating-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--rating-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .rating-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .chart-wrapper {
            position: sticky;
            top: 40px;
            height: 600px; /* Große Darstellung */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Muscle Review 2026</h1>
        <button class="theme-switch" onclick="toggleTheme()">Mode Wechseln</button>
    </div>

    <div class="main-container">
        <!-- Linke Seite: Bewertung -->
        <div id="inputs" class="input-section"></div>

        <!-- Rechte Seite: Grafik -->
        <div class="chart-wrapper">
            <canvas id="muscleChart"></canvas>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 
            'Bizepsumfang', 'Schulterbreite', 'Wadenvolumen',
            'Definition (KFA)', 'Vaskularität', 'Pump Effekt', 'Regeneration'
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        function toggleTheme() {
            const body = document.documentElement;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            updateChartTheme(newTheme);
        }

        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(catIndex, value, btn) {
            scores[catIndex] = value;
            const parent = btn.parentElement;
            parent.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            myChart.data.datasets[0].data = scores;
            myChart.update();
        }

        function initChart() {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        data: scores,
                        backgroundColor: 'rgba(150, 150, 150, 0.2)',
                        borderColor: '#888888',
                        borderWidth: 2,
                        pointBackgroundColor: '#888888'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0,
                            max: 5,
                            ticks: { display: false, stepSize: 1 },
                            grid: { color: isDark ? '#333' : '#eee' },
                            angleLines: { color: isDark ? '#333' : '#eee' },
                            pointLabels: {
                                color: isDark ? '#ffffff' : '#000000',
                                font: { size: 12, weight: '600' }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChartTheme(theme) {
            const isDark = theme === 'dark';
            myChart.options.scales.r.grid.color = isDark ? '#333' : '#eee';
            myChart.options.scales.r.angleLines.color = isDark ? '#333' : '#eee';
            myChart.options.scales.r.pointLabels.color = isDark ? '#ffffff' : '#000000';
            myChart.update();
        }

        initChart();
    </script>
</body>
</html>
