<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #f1f2f6;
            --accent-color: #ffca28;
            --border-color: #333;
            --rating-bg: #2d3436;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            align-self: center;
        }

        .step { display: none; width: 100%; }
        .step.active { display: block; }

        h1 { color: var(--accent-color); text-transform: uppercase; font-size: 1.3rem; margin-bottom: 8px; letter-spacing: 1px; }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .category-label { display: block; margin-bottom: 6px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; opacity: 0.8; }
        
        .rating-scale { display: flex; gap: 5px; }
        .rating-btn {
            flex: 1; padding: 12px; border: 1px solid var(--border-color);
            background: var(--rating-bg); color: var(--text-color);
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }
        .rating-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        .result-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .insult-box {
            padding: 12px 20px; 
            border: 1px solid var(--accent-color);
            border-radius: 10px; 
            margin: 10px 0; 
            font-style: italic;
            color: var(--accent-color); 
            font-size: 0.95rem; 
            line-height: 1.4;
            background: rgba(255, 202, 40, 0.05);
            width: 90%; 
            box-sizing: border-box;
        }

        .chart-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 380px; 
            margin: 10px 0;
        }

        .primary-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 16px; border-radius: 10px; font-weight: 900;
            text-transform: uppercase; width: 100%; max-width: 380px; cursor: pointer; 
            margin-top: 10px; font-size: 0.95rem;
        }

        .secondary-btn {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-color); padding: 12px; border-radius: 10px;
            width: 100%; max-width: 380px; cursor: pointer; margin-top: 8px; font-size: 0.85rem;
        }

        .legend-mini { font-size: 0.8rem; margin-bottom: 20px; font-weight: bold; color: var(--accent-color); opacity: 0.7; }
    </style>
</head>
<body>

    <div class="container">
        <div id="step1" class="step active">
            <h1>Muscle Review 2026</h1>
            <div class="legend-mini">1 = LAPPEN | 5 = MR. OLYMPIA</div>
            <div id="inputs" class="category-grid"></div>
            <button class="primary-btn" onclick="showResults()">Analyse starten</button>
        </div>

        <div id="step2" class="step">
            <div class="result-view">
                <h1>Dein Versagen</h1>
                <div id="insult" class="insult-box"></div>
                
                <div class="chart-container">
                    <canvas id="muscleChart"></canvas>
                </div>

                <button class="primary-btn" onclick="downloadChart()">Als .png speichern</button>
                <button class="secondary-btn" onclick="location.reload()">Werte korrigieren</button>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 'Bizeps', 
            'Schulter', 'Waden', 'Definition', 'Vaskularität', 
            'Pump', 'Regeneration'
        ];

        const insults = [
            "Dein Trainingsplan ist wohl eher ein Malbuch. Geh endlich schwer trainieren.",
            "Physikalisches Gesetz: Wo kein Widerstand, da kein Muskel. Fang mal damit an.",
            "Dein Körperbau erinnert an ein dezent geformtes Stück Weißbrot. Mehr Eisen!",
            "Süß, dass du das Sport nennst. Ich nenne es 'Stehen mit Gewichten'.",
            "Die Grafik sieht aus wie ein verhungertes Spinnennetz. Geh pumpen.",
            "Bist du im Gym zum Trainieren oder um die Klimaanlage zu testen?",
            "Deine Vaskularität ist so vorhanden wie deine Disziplin: Gar nicht.",
            "Glückwunsch zum stabilsten Lappen-Status 2026. Beweg deinen Arsch.",
            "Das Einzige, was hier massiv ist, ist deine Ignoranz gegenüber schweren Sätzen.",
            "Stopp die Ausreden. Fang an zu fressen und zu heben. Mehr trainieren!"
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(idx, val, btn) {
            scores[idx] = val;
            btn.parentElement.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showResults() {
            // VIBRATION hinzufügen (200ms)
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }

            window.scrollTo(0,0);
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('insult').innerText = insults[Math.floor(Math.random() * insults.length)];
            initChart();
        }

        function initChart() {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        data: scores,
                        backgroundColor: 'rgba(255, 202, 40, 0.2)',
                        borderColor: '#ffca28',
                        pointBackgroundColor: '#ffca28',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 5,
                            ticks: { display: false, stepSize: 1 },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#fff', font: { size: 10, weight: '600' } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function downloadChart() {
            const name = prompt("Name des Athleten:", "Lappen");
            if (!name) return;
            
            const originalCanvas = document.getElementById('muscleChart');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 800; tempCanvas.height = 950;
            
            tempCtx.fillStyle = '#0d0d0d';
            tempCtx.fillRect(0, 0, 800, 950);

            tempCtx.fillStyle = '#ffca28';
            tempCtx.font = 'bold 40px sans-serif';
            tempCtx.textAlign = 'center';
            tempCtx.fillText('MUSCLE REVIEW 2026', 400, 80);

            tempCtx.fillStyle = '#fff';
            tempCtx.font = '24px sans-serif';
            tempCtx.fillText('Athlet: ' + name, 400, 130);
            
            tempCtx.font = 'italic 20px sans-serif';
            tempCtx.fillStyle = '#ffca28';
            tempCtx.fillText('"' + document.getElementById('insult').innerText + '"', 400, 180);

            tempCtx.drawImage(originalCanvas, 100, 280, 600, 600);

            const link = document.createElement('a');
            link.download = `MuscleReview_${name}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
