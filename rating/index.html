<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-color: #d4af37;
            --border-color: #dcdde1;
            --rating-bg: #f1f2f6;
        }

        [data-theme="dark"] {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --text-color: #f1f2f6;
            --accent-color: #ffca28;
            --border-color: #333;
            --rating-bg: #2d3436;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        h1 { color: var(--accent-color); text-transform: uppercase; letter-spacing: -1px; margin: 0; }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 1000px;
            margin: 0 auto;
            min-height: 500px;
        }

        /* Schritt-Steuerung */
        .step { display: none; }
        .step.active { display: block; }

        .legend-box {
            background: var(--rating-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            font-weight: bold;
            border-left: 4px solid var(--accent-color);
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) { .category-grid { grid-template-columns: 1fr; } }

        .category-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.85em; }
        .rating-scale { display: flex; gap: 4px; }
        .rating-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border-color);
            background: var(--rating-bg); color: var(--text-color);
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .rating-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

        /* Analyse Seite */
        .result-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .insult-box {
            padding: 20px;
            border: 1px dashed var(--accent-color);
            border-radius: 8px;
            margin-bottom: 20px;
            font-style: italic;
            color: var(--accent-color);
            font-weight: 500;
        }

        .chart-container { height: 400px; width: 100%; }

        .primary-btn {
            background: var(--accent-color);
            color: #000; border: none; padding: 15px 30px;
            border-radius: 8px; font-weight: 800; cursor: pointer;
            text-transform: uppercase; width: 100%; margin-top: 20px;
        }

        .secondary-btn {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-color); padding: 10px; border-radius: 8px;
            cursor: pointer; margin-top: 10px; width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Muscle Review 2026</h1>
        <button onclick="toggleTheme()" class="rating-btn" style="flex:none; width:auto;">🌓 Mode</button>
    </div>

    <div class="container">
        <!-- SCHRITT 1: EINGABE -->
        <div id="step1" class="step active">
            <div class="legend-box">
                <span>1 = Lappen</span>
                <span>← DEINE REALITÄT →</span>
                <span>5 = Mr. Olympia</span>
            </div>
            <div id="inputs" class="category-grid"></div>
            <button class="primary-btn" onclick="showResults()">Analyse starten (auf eigene Gefahr)</button>
        </div>

        <!-- SCHRITT 2: ERGEBNIS -->
        <div id="step2" class="step">
            <div class="result-layout">
                <div>
                    <h3>Deine "Leistung"</h3>
                    <div id="insult" class="insult-box"></div>
                    <p>Zusammenfassend lässt sich sagen: Hör auf Ausreden zu suchen und geh endlich wieder richtig trainieren.</p>
                    <button class="primary-btn" onclick="downloadChart()">Als .png speichern</button>
                    <button class="secondary-btn" onclick="location.reload()">Neue Bewertung</button>
                </div>
                <div class="chart-container">
                    <canvas id="muscleChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 'Bizepsumfang', 
            'Schulterbreite', 'Waden', 'Definition (KFA)', 'Vaskularität', 
            'Pumpgefühl', 'Regeneration'
        ];

        const insults = [
            "Das Spinnennetz sieht eher aus wie ein Hilferuf.",
            "Physik ist keine Meinung – du musst einfach schwerer trainieren.",
            "Dein Bizeps hat die Vaskularität eines Toastbrots. Mehr Gewicht!",
            "Süß, dass du das Training nennst. Andere nennen das Aufwärmen.",
            "Die Grafik lügt nicht, aber deine Selbsteinschätzung vermutlich schon. Ab ins Gym.",
            "Herzlichen Glückwunsch zu dieser stabilen Mittelmäßigkeit. Nicht.",
            "Bist du sicher, dass du Hanteln hebst oder sortierst du sie nur?",
            "Dieses Review schreit förmlich nach Disziplinlosigkeit. Beweg dich.",
            "Selbst meine KI-Algorithmen haben mehr Muskeltonus als diese Werte.",
            "Schönes Netz. Würde gut als Untersetzer für deinen Proteinshake taugen, den du offensichtlich umsonst trinkst."
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        // UI Aufbau
        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(idx, val, btn) {
            scores[idx] = val;
            btn.parentElement.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function showResults() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            // Zufällige Beleidigung
            document.getElementById('insult').innerText = insults[Math.floor(Math.random() * insults.length)];
            
            initChart(document.documentElement.getAttribute('data-theme') || 'light');
        }

        function initChart(theme) {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            const isDark = theme === 'dark';
            const gold = isDark ? '#ffca28' : '#d4af37';

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        data: scores,
                        backgroundColor: 'rgba(212, 175, 55, 0.2)',
                        borderColor: gold,
                        pointBackgroundColor: gold,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0, max: 5, ticks: { display: false, stepSize: 1 },
                            grid: { color: isDark ? '#333' : '#eee' },
                            pointLabels: { color: isDark ? '#fff' : '#000', font: { size: 10 } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function toggleTheme() {
            const body = document.documentElement;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            if (myChart) initChart(newTheme);
        }

        function downloadChart() {
            const name = prompt("Name für dein Versagen angeben:", "Lappen");
            if (!name) return;
            
            const originalCanvas = document.getElementById('muscleChart');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 600; tempCanvas.height = 700;
            
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            tempCtx.fillStyle = isDark ? '#0d0d0d' : '#ffffff';
            tempCtx.fillRect(0, 0, 600, 700);

            tempCtx.fillStyle = isDark ? '#ffca28' : '#d4af37';
            tempCtx.font = 'bold 30px sans-serif';
            tempCtx.textAlign = 'center';
            tempCtx.fillText('MUSCLE REVIEW 2026', 300, 60);

            tempCtx.fillStyle = isDark ? '#ffffff' : '#333';
            tempCtx.font = '20px sans-serif';
            tempCtx.fillText('Athlet: ' + name, 300, 100);
            
            tempCtx.font = 'italic 16px sans-serif';
            tempCtx.fillText('"' + document.getElementById('insult').innerText + '"', 300, 140);

            tempCtx.drawImage(originalCanvas, 50, 180, 500, 500);

            const link = document.createElement('a');
            link.download = `Review_${name}.png`;
            link.href = tempCanvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
