<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muscle Review 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: #fcfcfc;
            --text-color: #1a1a1a;
            --accent-color: #000000;
            --border-color: #eeeeee;
            --rating-bg: #f5f5f5;
            --chart-grid: rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --border-color: #222222;
            --rating-bg: #1c1c1c;
            --chart-grid: rgba(255,255,255,0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 60px 20px;
            transition: background 0.4s ease;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            max-width: 1100px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 50px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .theme-switch {
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .theme-switch:hover { opacity: 1; }

        .content-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 60px;
            align-items: start;
        }

        @media (max-width: 950px) {
            .content-grid { grid-template-columns: 1fr; }
            .chart-container { order: -1; }
        }

        .category-item { margin-bottom: 24px; }

        .category-label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
        }

        .rating-scale { display: flex; gap: 4px; }

        .rating-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--rating-bg);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rating-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .chart-container {
            position: sticky;
            top: 40px;
            width: 100%;
            /* Vergrößerung der Grafik */
            min-height: 500px; 
            display: flex;
            align-items: center;
        }

        canvas { width: 100% !important; height: auto !important; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="header">
            <h1>Muscle Review 2026</h1>
            <button class="theme-switch" onclick="toggleTheme()">THEME UMSCHALTEN</button>
        </div>

        <div class="content-grid">
            <div id="inputs" class="input-section"></div>

            <div class="chart-container">
                <canvas id="muscleChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const categories = [
            'Bankdrücken', 'Kniebeugen', 'Kreuzheben', 
            'Bizepsumfang', 'Schulterbreite', 'Wadenvolumen',
            'Körperfett %', 'Vaskularität', 'Pump Effekt', 'Regeneration'
        ];

        let scores = new Array(categories.length).fill(1);
        let myChart;

        function toggleTheme() {
            const body = document.documentElement;
            const newTheme = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            updateChartTheme(newTheme);
        }

        const inputContainer = document.getElementById('inputs');
        categories.forEach((cat, index) => {
            const div = document.createElement('div');
            div.className = 'category-item';
            div.innerHTML = `
                <span class="category-label">${cat}</span>
                <div class="rating-scale">
                    ${[1,2,3,4,5].map(num => `<button class="rating-btn ${num===1?'active':''}" onclick="setScore(${index}, ${num}, this)">${num}</button>`).join('')}
                </div>
            `;
            inputContainer.appendChild(div);
        });

        function setScore(catIndex, value, btn) {
            scores[catIndex] = value;
            const parent = btn.parentElement;
            parent.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            myChart.data.datasets[0].data = scores;
            myChart.update();
        }

        function initChart() {
            const ctx = document.getElementById('muscleChart').getContext('2d');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            
            myChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: categories,
                    datasets: [{
                        data: scores,
                        backgroundColor: 'rgba(120, 120, 120, 0.1)',
                        borderColor: '#888',
                        borderWidth: 1,
                        pointRadius: 4,
                        pointBackgroundColor: '#888'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            min: 0,
                            max: 5,
                            ticks: { display: false, stepSize: 1 },
                            grid: { color: 'rgba(120, 120, 120, 0.1)' },
                            angleLines: { color: 'rgba(120, 120, 120, 0.1)' },
                            pointLabels: {
                                color: isDark ? '#ffffff' : '#1a1a1a',
                                font: { size: 11, family: 'Inter' }
                            }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateChartTheme(theme) {
            const isDark = theme === 'dark';
            myChart.options.scales.r.pointLabels.color = isDark ? '#ffffff' : '#1a1a1a';
            myChart.options.scales.r.grid.color = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.05)';
            myChart.update();
        }

        initChart();
    </script>
</body>
</html>
