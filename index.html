<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>alex heinemann</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Noch dunklerer Hintergrund */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            color: #a6845d;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            color: #a6845d;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 60px;
            text-transform: lowercase;
            user-select: none;
            pointer-events: none;
        }

        .constellation {
            position: relative;
            height: 300px;
            width: 100%;
            margin: 0 auto;
        }

        .dot-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }

        .outer-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(166, 132, 93, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner-dot {
            width: 10px;
            height: 10px;
            background-color: #a6845d;
            border-radius: 50%;
        }

        /* --- Mega Puls Effekt --- */
        .dot-wrapper.active .outer-ring {
            animation: mega-pulse 0.6s cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
        }

        @keyframes mega-pulse {
            0% { transform: scale(1); border-color: #a6845d; box-shadow: 0 0 0 0px rgba(166, 132, 93, 0.8); }
            100% { transform: scale(6); border-color: rgba(166, 132, 93, 0); box-shadow: 0 0 60px 30px rgba(166, 132, 93, 0); opacity: 0; }
        }

        /* Positionen der Punkte */
        .p1 { top: 15%; left: 18%; }
        .p2 { top: 45%; left: 63%; }
        .p3 { top: 67%; left: 28%; }
        .p4 { top: 88%; left: 78%; }

        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        line { stroke: #a6845d; stroke-width: 1; stroke-dasharray: 5, 5; opacity: 0.2; }

        /* --- Ausweichender CTA Button --- */
        .cta-button {
            position: absolute;
            bottom: 10vh;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            border: 1px solid #a6845d;
            background: transparent;
            color: #a6845d;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            white-space: nowrap;
            z-index: 50;
            outline: none;
        }

        /* --- Partikel & Typo Overlay --- */
        #particle-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .sparkle {
            position: absolute;
            background-color: #a6845d;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes explode-v2 {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .unfriendly-text {
            position: absolute;
            font-style: italic;
            font-size: 1.2rem;
            color: #a6845d;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            z-index: 110;
        }

        @keyframes float-up {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <div class="container">
        <h1>alex heinemann</h1>
        <div class="constellation">
            <svg viewBox="0 0 400 300">
                <line x1="18%" y1="15%" x2="63%" y2="45%" />
                <line x1="18%" y1="15%" x2="28%" y2="67%" />
                <line x1="28%" y1="67%" x2="63%" y2="45%" />
                <line x1="63%" y1="45%" x2="78%" y2="88%" />
            </svg>

            <div class="dot-wrapper p1" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p2" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p3" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p4" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
        </div>
    </div>

    <button class="cta-button" id="evasive-btn">Kontakt</button>

    <script>
        const particleContainer = document.getElementById('particle-container');
        const phrases = ["Lass mich!", "Aua!", "Neeee!", "Stopp!", "Nicht anfassen.", "Lass das."];
        const evasiveBtn = document.getElementById('evasive-btn');

        // --- BUTTON LOGIK ---
        const moveButton = () => {
            // Text ändern
            evasiveBtn.innerText = "Nein! Sicher nicht!";
            
            // Zufällige neue Position berechnen
            const padding = 50;
            const newX = Math.random() * (window.innerWidth - evasiveBtn.offsetWidth - padding * 2) + padding;
            const newY = Math.random() * (window.innerHeight - evasiveBtn.offsetHeight - padding * 2) + padding;

            // Position anwenden (Button wird absolut positioniert)
            evasiveBtn.style.position = 'fixed';
            evasiveBtn.style.left = `${newX}px`;
            evasiveBtn.style.top = `${newY}px`;
            evasiveBtn.style.bottom = 'auto';
            evasiveBtn.style.transform = 'none';
        };

        // Reagiert auf Hover (Desktop) und TouchStart (Mobile)
        evasiveBtn.addEventListener('mouseover', moveButton);
        evasiveBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Verhindert den eigentlichen Klick
            moveButton();
        });

        // --- GRAFIK EFFEKT LOGIK ---
        function triggerEffect(element) {
            element.classList.remove('active');
            void element.offsetWidth; 
            element.classList.add('active');

            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            if (Math.random() > 0.3) showText(x, y);
            createExplosion(x, y);

            setTimeout(() => { element.classList.remove('active'); }, 600);
        }

        function showText(x, y) {
            const textEl = document.createElement('div');
            textEl.className = 'unfriendly-text';
            textEl.innerText = phrases[Math.floor(Math.random() * phrases.length)];
            textEl.style.left = `${x}px`;
            textEl.style.top = `${y - 30}px`;
            textEl.style.animation = 'float-up 1.5s ease-out forwards';
            particleContainer.appendChild(textEl);
            setTimeout(() => textEl.remove(), 1500);
        }

        function createExplosion(x, y) {
            const count = 65; 
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'sparkle';
                const size = Math.random() * 5 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 400;
                particle.style.setProperty('--dx', `${Math.cos(angle) * velocity}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * velocity}px`);

                const duration = 0.5 + Math.random() * 1.3;
                particle.style.animation = `explode-v2 ${duration}s cubic-bezier(0.1, 0.9, 0.2, 1) forwards`;

                particleContainer.appendChild(particle);
                setTimeout(() => particle.remove(), duration * 1000);
            }
        }
    </script>
</body>
</html>
