<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alex heinemann - Interactive</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            color: #a6845d;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            color: #a6845d;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 60px;
            text-transform: lowercase;
            user-select: none;
            pointer-events: none; /* Klicks gehen durch den Text durch zur Grafik */
        }

        .constellation {
            position: relative;
            height: 300px;
            width: 100%;
            margin: 0 auto;
        }

        .dot-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
        }

        .outer-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(166, 132, 93, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .inner-dot {
            width: 10px;
            height: 10px;
            background-color: #a6845d;
            border-radius: 50%;
        }

        /* --- Intensiver Puls-Effekt für den getippten Ring --- */
        .dot-wrapper.active .outer-ring {
            animation: intense-pulse 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes intense-pulse {
            0% { transform: scale(1); border-color: #a6845d; box-shadow: 0 0 0 0px rgba(166, 132, 93, 0.7); }
            100% { transform: scale(4); border-color: rgba(166, 132, 93, 0); box-shadow: 0 0 40px 20px rgba(166, 132, 93, 0); }
        }

        /* Positionen */
        .p1 { top: 15%; left: 18%; }
        .p2 { top: 45%; left: 63%; }
        .p3 { top: 67%; left: 28%; }
        .p4 { top: 88%; left: 78%; }

        svg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        line {
            stroke: #a6845d; stroke-width: 1; stroke-dasharray: 5, 5; opacity: 0.2;
        }

        /* --- Partikel System (Full Screen) --- */
        #particle-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        .sparkle {
            position: absolute;
            background-color: #a6845d;
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <div class="container">
        <h1>alex heinemann</h1>

        <div class="constellation">
            <svg viewBox="0 0 400 300">
                <line x1="18%" y1="15%" x2="63%" y2="45%" />
                <line x1="18%" y1="15%" x2="28%" y2="67%" />
                <line x1="28%" y1="67%" x2="63%" y2="45%" />
                <line x1="63%" y1="45%" x2="78%" y2="88%" />
            </svg>

            <div class="dot-wrapper p1" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p2" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p3" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p4" onclick="triggerEffect(this)"><div class="outer-ring"><div class="inner-dot"></div></div></div>
        </div>
    </div>

    <script>
        const particleContainer = document.getElementById('particle-container');

        function triggerEffect(element) {
            // 1. Ring-Animation neu starten
            element.classList.remove('active');
            void element.offsetWidth; 
            element.classList.add('active');

            // 2. Position des getippten Punktes ermitteln
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // 3. Massenhaft Funken erzeugen (ca. 40-50 Stück)
            createExplosion(x, y);
        }

        function createExplosion(x, y) {
            const count = 45; 
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('sparkle');
                
                // Zufällige Größe für organischen Look
                const size = Math.random() * 4 + 1;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Startposition am Finger/Punkt
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                // Zufällige Flugrichtung über den ganzen Schirm
                // Wir nutzen einen großen Radius für die Bewegung
                const angle = Math.random() * Math.PI * 2;
                const velocity = 50 + Math.random() * 250; // Weite des Wurfs
                const dx = Math.cos(angle) * velocity;
                const dy = Math.sin(angle) * velocity;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                // Animation mit leicht unterschiedlichen Zeiten
                const duration = 0.6 + Math.random() * 0.9;
                particle.style.animation = `explode ${duration}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;

                particleContainer.appendChild(particle);

                // Cleanup
                setTimeout(() => {
                    particle.remove();
                }, duration * 1000);
            }
        }
    </script>

</body>
</html>
