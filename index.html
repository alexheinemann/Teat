<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alex heinemann</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,900&display=swap" rel="stylesheet">
    <style>
        body {
            /* Das dunkle Anthrazit aus deinem Design */
            background-color: #212121;
            font-family: 'Bodoni Moda', serif;
            color: white;
            margin: 0;
            overflow: hidden; /* Verhindert Scrollen auf Mobilgeräten */
        }
        
        .title-text {
            font-size: 3rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitle-text {
            font-size: 1.8rem;
            font-style: italic;
            opacity: 0.9;
        }

        /* Styling für den Button unten */
        .notify-btn {
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: transparent;
            padding: 10px 24px;
            font-family: sans-serif; /* Serifenlose Schrift für den Button wie im Design */
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .notify-btn:hover {
            background: white;
            color: #212121;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-16 px-6 text-center">

    <div class="flex-1 flex flex-col justify-center space-y-4">
        <h1 class="title-text lowercase">
            alex heinemann
        </h1>
        <p class="subtitle-text lowercase">
            is
        </p>
        <h2 class="title-text lowercase">
            coming soon
        </h2>

        <div class="py-12 flex justify-center">
            <svg width="120" height="180" viewBox="0 0 100 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="20" y1="20" x2="60" y2="80" stroke="white" stroke-width="1.5"/>
                <line x1="60" y1="80" x2="30" y2="110" stroke="white" stroke-width="1.5"/>
                <line x1="60" y1="80" x2="80" y2="140" stroke="white" stroke-width="1.5"/>
                <line x1="20" y1="20" x2="30" y2="110" stroke="white" stroke-width="1.5"/>
                
                <circle cx="20" cy="20" r="4" fill="white"/>
                <circle cx="60" cy="80" r="4" fill="white"/>
                <circle cx="30" cy="110" r="4" fill="white"/>
                <circle cx="80" cy="140" r="4" fill="white"/>
                <circle cx="25" cy="25" r="1.5" fill="white" fill-opacity="0.5"/>
            </svg>
        </div>
    </div>

    <div class="w-full space-y-6">
        <p class="text-sm opacity-80 font-sans tracking-wide">
            Sign up for notifications.
        </p>
        <button class="notify-btn">
            Notify Me
        </button>
    </div>

</body>
</html>
