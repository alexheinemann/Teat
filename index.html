<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alex heinemann</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c; /* Der dunkle Hintergrundwert aus deinem Bild */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #a6845d; /* Der Gold/Beige-Ton des Textes */
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 60px;
        }

        /* Die Grafik-Elemente */
        .constellation {
            position: relative;
            height: 300px;
            width: 100%;
            margin: 0 auto;
        }

        .dot-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(166, 132, 93, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .inner-dot {
            width: 10px;
            height: 10px;
            background-color: #a6845d;
            border-radius: 50%;
        }

        /* Exakte Positionierung der Punkte basierend auf deiner Vorlage */
        .p1 { top: 10%; left: 15%; }
        .p2 { top: 40%; left: 60%; }
        .p3 { top: 60%; left: 25%; }
        .p4 { top: 85%; left: 75%; }

        /* Verbindungslinien (gestrichelt) */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        line {
            stroke: #a6845d;
            stroke-width: 1;
            stroke-dasharray: 5, 5;
            opacity: 0.2;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>alex heinemann</h1>

        <div class="constellation">
            <svg>
                <line x1="20%" y1="15%" x2="65%" y2="45%" />
                <line x1="20%" y1="15%" x2="30%" y2="65%" />
                <line x1="30%" y1="65%" x2="65%" y2="45%" />
                <line x1="65%" y1="45%" x2="80%" y2="90%" />
            </svg>

            <div class="dot-wrapper p1"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p2"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p3"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p4"><div class="outer-ring"><div class="inner-dot"></div></div></div>
        </div>
    </div>

</body>
</html>
