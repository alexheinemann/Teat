<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alex heinemann - Tap Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c2c2c; /* Hintergrundfarbe */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            color: #a6845d; /* Akzentfarbe */
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
            cursor: pointer; /* Zeigt an, dass die Grafik klickbar ist */
        }

        h1 {
            color: #a6845d;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 60px;
            text-transform: lowercase;
            user-select: none; /* Verhindert Textmarkierung beim Tippen */
        }

        /* Container für die interaktive Grafik */
        .constellation {
            position: relative;
            height: 300px;
            width: 100%;
            margin: 0 auto;
            /* Ermöglicht das Platzieren von Partikeln */
            pointer-events: none; 
        }
        /* Nur die Punkte sollen Klicks abfangen */
        .dot-wrapper {
            pointer-events: auto;
        }

        .dot-wrapper {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translate(-50%, -50%);
        }

        .outer-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(166, 132, 93, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.2s ease;
        }

        /* --- Puls-Effekt CSS --- */
        /* Diese Klasse wird per JS beim Klick hinzugefügt */
        .constellation.active .outer-ring {
            animation: ring-pulse 1s ease-out forwards;
        }

        @keyframes ring-pulse {
            0% {
                transform: scale(1);
                border-color: rgba(166, 132, 93, 0.3);
                box-shadow: 0 0 0 0px rgba(166, 132, 93, 0.4);
            }
            50% {
                border-color: rgba(166, 132, 93, 0.8);
                box-shadow: 0 0 10px 4px rgba(166, 132, 93, 0.2);
            }
            100% {
                transform: scale(1.15);
                border-color: rgba(166, 132, 93, 0.0);
                box-shadow: 0 0 20px 15px rgba(166, 132, 93, 0.0);
            }
        }

        .inner-dot {
            width: 10px;
            height: 10px;
            background-color: #a6845d;
            border-radius: 50%;
        }

        /* Exakte Positionierung der Punkte */
        .p1 { top: 15%; left: 18%; }
        .p2 { top: 45%; left: 63%; }
        .p3 { top: 67%; left: 28%; }
        .p4 { top: 88%; left: 78%; }

        /* --- Verbindungslinien SVG --- */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        line {
            stroke: #a6845d;
            stroke-width: 1;
            stroke-dasharray: 5, 5;
            opacity: 0.2;
        }

        /* --- Funken-Partikel CSS --- */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #a6845d;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            /* Die Animation wird per JS zugewiesen */
        }

        @keyframes sparkle-fly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                /* Diese Werte werden per JS für jeden Funken variiert */
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

    </style>
</head>
<body>

    <div class="container" id="interaction-zone">
        <h1>alex heinemann</h1>

        <div class="constellation" id="constellation-graphic">
            <svg viewBox="0 0 400 300">
                <line x1="18%" y1="15%" x2="63%" y2="45%" />
                <line x1="18%" y1="15%" x2="28%" y2="67%" />
                <line x1="28%" y1="67%" x2="63%" y2="45%" />
                <line x1="63%" y1="45%" x2="78%" y2="88%" />
            </svg>

            <div class="dot-wrapper p1" id="dot1"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p2" id="dot2"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p3" id="dot3"><div class="outer-ring"><div class="inner-dot"></div></div></div>
            <div class="dot-wrapper p4" id="dot4"><div class="outer-ring"><div class="inner-dot"></div></div></div>
        </div>
    </div>

    <script>
        const constellation = document.getElementById('constellation-graphic');
        const dots = [
            document.getElementById('dot1'),
            document.getElementById('dot2'),
            document.getElementById('dot3'),
            document.getElementById('dot4')
        ];

        // Die Haupt-Interaktionszone ist der gesamte Text/Grafik-Bereich
        document.getElementById('interaction-zone').addEventListener('click', function(e) {
            
            // 1. CSS-Puls-Animation für die Ringe triggern
            // Wir entfernen die Klasse erst, damit sie neu hinzugefügt werden kann (Restart Animation)
            constellation.classList.remove('active');
            // 'void trigger' zwingt den Browser zum CSS-Reflow
            void constellation.offsetWidth; 
            constellation.classList.add('active');

            // Nach der Animationsdauer die Klasse wieder entfernen
            setTimeout(() => {
                constellation.classList.remove('active');
            }, 1000); // 1000ms = Dauer der @keyframes ring-pulse

            // 2. JS-Effekt: Funken von jedem Punkt erzeugen
            dots.forEach(dot => {
                createSparkles(dot);
            });
        });

        // Funktion zum Erzeugen und Animieren von Funken-Partikeln
        function createSparkles(targetDot) {
            // Holen der Position des Punktes relative zur .constellation
            const dotRect = targetDot.getBoundingClientRect();
            const constRect = constellation.getBoundingClientRect();
            
            const centerX = dotRect.left - constRect.left + dotRect.width / 2;
            const centerY = dotRect.top - constRect.top + dotRect.height / 2;

            // Anzahl der Funken pro Punkt
            const sparkleCount = 6;

            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                
                // Startposition (Mitte des Punktes)
                sparkle.style.left = `${centerX}px`;
                sparkle.style.top = `${centerY}px`;

                // Zufällige Flugrichtung und Distanz
                const angle = Math.random() * Math.PI * 2; // 0 bis 360 Grad
                const distance = 30 + Math.random() * 40; // 30 bis 70 Pixel weit
                
                // Berechnung der Endposition (dx, dy)
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                // Zufällige Animationsdauer
                const duration = 0.5 + Math.random() * 0.5; // 0.5 bis 1 Sekunde

                // Zuweisung der CSS-Variablen für die @keyframes
                sparkle.style.setProperty('--dx', `${dx}px`);
                sparkle.style.setProperty('--dy', `${dy}px`);
                sparkle.style.animation = `sparkle-fly ${duration}s ease-out forwards`;

                // Partikel zur Grafik hinzufügen
                constellation.appendChild(sparkle);

                // Partikel nach der Animation wieder entfernen, um Speicher zu sparen
                setTimeout(() => {
                    sparkle.remove();
                }, duration * 1000);
            }
        }
    </script>

</body>
</html>
