<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampenplanung Blumenstr. 21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #eaeaea;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --primary: #d4af37;
            --primary-hover: #b5952f;
            --success: #10b981;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body { font-family: var(--font-family); background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; }
        #ui-area { background-color: var(--card-bg); padding: 3rem 2.5rem; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.15); margin-bottom: 2rem; }
        h1 { font-size: 1.8rem; margin-top: 0; margin-bottom: 2.5rem; text-align: center; color: var(--primary); text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; }
        
        .room-item { margin-bottom: 1.5rem; display: flex; flex-direction: column; }
        .room-label { font-weight: 500; margin-bottom: 0.6rem; font-size: 0.95rem; color: var(--text-main); text-transform: uppercase; }
        
        select { padding: 1rem; border-radius: 8px; background: #0a0a0a; color: white; border: 1px solid var(--border-color); cursor: pointer; width: 100%; }
        select:disabled { opacity: 0.5; }
        
        .btn-export { background-color: var(--primary); color: #000; border: none; padding: 1.2rem; font-weight: 700; text-transform: uppercase; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 1rem; }
        .btn-export:hover { background-color: var(--primary-hover); }

        #print-layout { display: none; width: 800px; background-color: var(--bg-color); padding: 60px; color: var(--text-main); }
        .print-row { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #222; }
        .print-cat { color: var(--primary); font-weight: bold; text-transform: uppercase; }
        .print-waste { color: #ff4444; font-weight: bold; margin-top: 40px; border-top: 2px solid #ff4444; padding-top: 20px; text-transform: uppercase;}
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="ui-area">
        <h1>Lampenplanung Blumenstr. 21</h1>
        <div id="rooms-container"></div>
    </div>
    <button class="btn-export" id="btn-export">💾 Plan als JPG speichern</button>
</div>

<div id="print-layout"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const oldLamps = [
            { id: "lamp1", name: "Industrial Lampe", room: "Flur" },
            { id: "lamp2", name: "Lampe über Esstisch", room: "Wohnzimmer" },
            { id: "lamp3", name: "Kugellampe", room: "Wohnzimmer" },
            { id: "lamp4", name: "Todessternlampe", room: "Office Corina" },
            { id: "lamp5", name: "Goldröhre", room: "Schlafzimmer" },
            { id: "lamp6", name: "Schirmlampe", room: "Küche" },
            { id: "lamp7", name: "Gitterlampe", room: "Office Alex" }
        ];

        const newRooms = [
            { name: "Flur", sub: "Lampe 1" }, { name: "Flur", sub: "Lampe 2" },
            { name: "Wohnzimmer", sub: "Lampe" }, { name: "Wohnzimmer", sub: "Spot??" },
            { name: "Office Corina", sub: "Lampe" }, { name: "Schlafzimmer", sub: "Lampe" },
            { name: "Bad oben", sub: "Lampe" }, { name: "Bad unten", sub: "Lampe" },
            { name: "Toilette oben", sub: "Leuchtspiegel?" }, { name: "Toilette unten", sub: "Leuchtspiegel?" },
            { name: "Küche", sub: "Lampe" }, { name: "Office Alex", sub: "Lampe" },
            { name: "Office Alex", sub: "Spot Holzecke?" }
        ];

        const container = document.getElementById('rooms-container');

        // UI Aufbau
        newRooms.forEach(room => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.innerHTML = `<label class="room-label">${room.name} (${room.sub})</label>
                             <select class="lamp-select"><option value="">-- Bitte wählen --</option><option value="NEU">✨ Neue Lampe kaufen</option>
                             ${oldLamps.map(l => `<option value="${l.id}">${l.name} (aus ${l.room})</option>`).join('')}</select>`;
            container.appendChild(div);
        });

        // Dropdown Sperr-Logik
        const updateDropdowns = () => {
            const selects = document.querySelectorAll('.lamp-select');
            const selectedValues = Array.from(selects).map(s => s.value).filter(v => v !== "" && v !== "NEU");
            
            selects.forEach(select => {
                const currentVal = select.value;
                Array.from(select.options).forEach(opt => {
                    if (opt.value === "" || opt.value === "NEU") return;
                    // Deaktivieren, wenn schon gewählt und nicht die aktuell gewählte in diesem Dropdown
                    opt.disabled = selectedValues.includes(opt.value) && opt.value !== currentVal;
                });
            });
        };

        container.addEventListener('change', updateDropdowns);

        // Export Logik
        document.getElementById('btn-export').addEventListener('click', () => {
            const uiArea = document.getElementById('main-container');
            const printArea = document.getElementById('print-layout');
            printArea.innerHTML = '<h1>Lampenplanung Blumenstr. 21</h1>';

            const usedLampIds = [];
            document.querySelectorAll('.lamp-select').forEach((sel, i) => {
                const row = document.createElement('div');
                row.className = 'print-row';
                const roomName = newRooms[i].name + " (" + newRooms[i].sub + ")";
                
                if (sel.value && sel.value !== "NEU") usedLampIds.push(sel.value);
                
                const selectedText = sel.value === "NEU" ? "✨ Neue Lampe kaufen" : (sel.value ? sel.options[sel.selectedIndex].text : "— offen —");
                
                row.innerHTML = `<span class="print-cat">${roomName}</span><span>${selectedText}</span>`;
                printArea.appendChild(row);
            });

            // Restliche Lampen finden
            const unused = oldLamps.filter(l => !usedLampIds.includes(l.id));
            if (unused.length > 0) {
                printArea.innerHTML += `<div class="print-waste"><h3>Wegwerfen / Verkaufen</h3></div>` + 
                unused.map(l => `<div class="print-row"><span>${l.name} (${l.room})</span></div>`).join('');
            }

            uiArea.style.display = 'none';
            printArea.style.display = 'block';

            html2canvas(printArea, { scale: 2, backgroundColor: "#0a0a0a" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Lampenplan_Final.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                printArea.style.display = 'none';
                uiArea.style.display = 'block';
            });
        });
    });
</script>
</body>
</html>
