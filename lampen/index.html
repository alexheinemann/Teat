<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampenplanung Blumenstr. 21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            /* Premium Gold & Black Theme Colors */
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #eaeaea;
            --text-muted: #888888;
            --border-color: #2a2a2a;
            --primary: #d4af37; /* Metallic Gold */
            --primary-hover: #b5952f;
            --success: #10b981; /* Green Indicator */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        #export-area {
            background-color: var(--card-bg);
            padding: 3rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.05);
            margin-bottom: 2rem;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 2.5rem;
            text-align: center;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--primary);
        }

        .room-item {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .room-label {
            font-weight: 500;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            position: relative;
        }

        select {
            flex: 1;
            padding: 1rem 1.25rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #0a0a0a;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
            appearance: none;
            -webkit-appearance: none;
        }

        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .input-wrapper::after {
            content: '▼';
            position: absolute;
            right: 3.5rem;
            font-size: 0.7rem;
            color: var(--primary);
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .indicator {
            width: 28px;
            height: 28px;
            margin-left: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--success);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .room-item.is-selected select {
            border-color: var(--primary);
            background-color: rgba(212, 175, 55, 0.02);
        }
        
        .room-item.is-selected .input-wrapper::after {
            color: var(--primary);
        }

        .room-item.is-selected .indicator {
            opacity: 1;
            transform: scale(1);
        }

        .btn-export {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn-export:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-export:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="export-area">
            <h1>Lampenplanung Blumenstr. 21</h1>
            <div id="rooms-container"></div>
        </div>
        
        <button class="btn-export" onclick="exportToJPG()">💾 Plan als JPG speichern</button>
    </div>

    <script>
        // Bestand alte Wohnung[cite: 1]
        const oldLamps = [
            { name: "Industrial Lampe", room: "Flur" },
            { name: "Lampe über Esstisch", room: "Wohnzimmer" },
            { name: "Kugellampe", room: "Wohnzimmer" },
            { name: "Todessternlampe", room: "Office Corina" },
            { name: "Goldröhre", room: "Schlafzimmer" },
            { name: "Schirmlampe", room: "Küche" },
            { name: "Gitterlampe", room: "Office Alex" }
        ];

        // Überkategorien neue Wohnung[cite: 1]
        const newRooms = [
            "Flur",
            "Wohnzimmer",
            "Office Corina",
            "Schlafzimmer",
            "Bad oben",
            "Bad unten",
            "Toilette oben",
            "Toilette unten",
            "Küche",
            "Office Alex"
        ];

        // UI generieren
        const container = document.getElementById('rooms-container');

        newRooms.forEach((room) => {
            const roomDiv = document.createElement('div');
            roomDiv.className = 'room-item';

            const label = document.createElement('label');
            label.className = 'room-label';
            label.innerText = room;

            const inputWrapper = document.createElement('div');
            inputWrapper.className = 'input-wrapper';

            const select = document.createElement('select');
            
            select.addEventListener('change', function() {
                if(this.value !== "") {
                    roomDiv.classList.add('is-selected');
                } else {
                    roomDiv.classList.remove('is-selected');
                }
            });
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = "";
            defaultOpt.innerText = "-- Bitte wählen --";
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            select.appendChild(defaultOpt);

            const newLampOpt = document.createElement('option');
            newLampOpt.value = "NEU";
            newLampOpt.innerText = "✨ Neue Lampe kaufen";
            select.appendChild(newLampOpt);

            oldLamps.forEach((lamp, idx) => {
                const opt = document.createElement('option');
                opt.value = `${lamp.name}_${idx}`;
                opt.innerText = `${lamp.name} (${lamp.room})`;
                select.appendChild(opt);
            });

            const indicator = document.createElement('div');
            indicator.className = 'indicator';
            indicator.innerHTML = '✓';

            inputWrapper.appendChild(select);
            inputWrapper.appendChild(indicator);
            
            roomDiv.appendChild(label);
            roomDiv.appendChild(inputWrapper);
            container.appendChild(roomDiv);
        });

        // JPG Export Logik
        function exportToJPG() {
            const exportArea = document.getElementById('export-area');
            const button = document.querySelector('.btn-export');
            
            const originalText = button.innerText;
            button.innerText = "⏳ Generiere JPG...";
            button.style.opacity = "0.7";
            
            html2canvas(exportArea, {
                scale: 2, 
                backgroundColor: "#141414", // Match mit neuem Card-Background
                logging: false,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Lampenplanung_Blumenstr21.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                
                button.innerText = originalText;
                button.style.opacity = "1";
            }).catch(err => {
                console.error("Fehler: ", err);
                alert("Export fehlgeschlagen.");
                button.innerText = originalText;
                button.style.opacity = "1";
            });
        }
    </script>
</body>
</html>
