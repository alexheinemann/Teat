<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampenplanung Blumenstr. 21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --text-main: #eaeaea;
            --primary: #d4af37;
            --border-color: #2a2a2a;
        }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; }
        #ui-area { background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.15); }
        h1 { font-size: 1.5rem; color: var(--primary); text-align: center; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .room-item { margin-bottom: 1.5rem; }
        .room-label { display: block; font-size: 0.9rem; margin-bottom: 0.4rem; text-transform: uppercase; }
        select, input { padding: 0.8rem; border-radius: 6px; background: #000; color: white; border: 1px solid var(--border-color); width: 100%; box-sizing: border-box; }
        .input-group { display: none; margin-top: 5px; }
        .btn-export { background-color: var(--primary); color: #000; padding: 1rem; font-weight: bold; border: none; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="ui-area">
        <h1><span>💡</span> Lampenplanung Blumenstr. 21</h1>
        <div id="rooms-container"></div>
    </div>
    <button class="btn-export" id="btn-export">💾 Plan als JPG speichern</button>
</div>

<script>
    const oldLamps = [
        { id: "lamp1", name: "Industrial Lampe", room: "Flur" },
        { id: "lamp2", name: "Lampe über Esstisch", room: "Wohnzimmer" },
        { id: "lamp3", name: "Kugellampe", room: "Wohnzimmer" },
        { id: "lamp4", name: "Todessternlampe", room: "Office Corina" },
        { id: "lamp5", name: "Goldröhre", room: "Schlafzimmer" },
        { id: "lamp6", name: "Schirmlampe", room: "Küche" },
        { id: "lamp7", name: "Gitterlampe", room: "Office Alex" }
    ];

    const newRooms = [
        { name: "Flur", sub: "Lampe 1" }, { name: "Flur", sub: "Lampe 2" },
        { name: "Wohnzimmer", sub: "Lampe" }, { name: "Wohnzimmer", sub: "Spot??" },
        { name: "Office Corina", sub: "Lampe" }, { name: "Schlafzimmer", sub: "Lampe" },
        { name: "Bad oben", sub: "Lampe" }, { name: "Bad unten", sub: "Lampe" },
        { name: "Toilette oben", sub: "Leuchtspiegel?" }, { name: "Toilette unten", sub: "Leuchtspiegel?" },
        { name: "Küche", sub: "Lampe" }, { name: "Office Alex", sub: "Lampe" },
        { name: "Office Alex", sub: "Spot Holzecke?" }
    ];

    function renderSelect(selectElement, selectedValue, savedWish) {
        const currentSelected = selectElement.value || selectedValue;
        const allSelects = document.querySelectorAll('.lamp-select');
        const taken = Array.from(allSelects)
            .map(s => s.value)
            .filter(v => v && v !== "NEU" && v !== currentSelected);

        selectElement.innerHTML = `<option value="">-- Bitte wählen --</option><option value="NEU">✨ Neue Lampe kaufen</option>`;
        
        oldLamps.forEach(l => {
            if (!taken.includes(l.id)) {
                const opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = `${l.name} (${l.room})`;
                if (l.id === currentSelected) opt.selected = true;
                selectElement.appendChild(opt);
            }
        });
        
        if (currentSelected === "NEU") {
            selectElement.querySelector('option[value="NEU"]').selected = true;
        }
    }

    function init() {
        const container = document.getElementById('rooms-container');
        const savedData = JSON.parse(localStorage.getItem('lampPlan')) || {};

        newRooms.forEach((room, index) => {
            const div = document.createElement('div');
            div.className = 'room-item';
            div.innerHTML = `<label class="room-label">${room.name} (${room.sub})</label>
                             <select class="lamp-select" data-index="${index}"></select>
                             <div class="input-group" id="group-${index}"><input type="text" placeholder="Was stellst du dir vor?" class="wish-input" data-index="${index}"></div>`;
            container.appendChild(div);

            const sel = div.querySelector('select');
            const inpGroup = div.querySelector('.input-group');
            const inp = div.querySelector('.wish-input');
            
            if (savedData[index]) {
                sel.value = savedData[index].val;
                inp.value = savedData[index].wish || "";
                inpGroup.style.display = (sel.value === "NEU") ? "block" : "none";
            }
        });

        // Initialer Render aller Dropdowns
        document.querySelectorAll('.lamp-select').forEach((sel, i) => renderSelect(sel, savedData[i]?.val));

        container.addEventListener('change', (e) => {
            if (e.target.classList.contains('lamp-select')) {
                const group = e.target.parentElement.querySelector('.input-group');
                group.style.display = (e.target.value === "NEU") ? "block" : "none";
                
                // Alle Dropdowns aktualisieren
                document.querySelectorAll('.lamp-select').forEach(sel => renderSelect(sel));
                
                // Speichern
                const data = {};
                document.querySelectorAll('.lamp-select').forEach((s, i) => {
                    data[i] = { val: s.value, wish: document.querySelectorAll('.wish-input')[i].value };
                });
                localStorage.setItem('lampPlan', JSON.stringify(data));
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
