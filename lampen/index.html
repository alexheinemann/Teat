<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lampenplanung Blumenstr. 21</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #eaeaea; padding: 2rem; }
        .container { max-width: 600px; margin: auto; }
        .room-item { margin-bottom: 1.5rem; background: #141414; padding: 1rem; border-radius: 8px; }
        select, input { width: 100%; padding: 0.8rem; margin-top: 0.5rem; background: #000; color: #fff; border: 1px solid #333; }
        .btn-export { background: #d4af37; color: #000; padding: 1rem; width: 100%; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>💡 Lampenplanung</h1>
    <div id="rooms-container"></div>
    <button class="btn-export" onclick="alert('Export-Funktion kann hier ergänzt werden')">💾 Speichern</button>
</div>

<script>
    const oldLamps = [
        { id: "lamp1", name: "Industrial Lampe" },
        { id: "lamp2", name: "Lampe über Esstisch" },
        { id: "lamp3", name: "Kugellampe" },
        { id: "lamp4", name: "Todessternlampe" },
        { id: "lamp5", name: "Goldröhre" },
        { id: "lamp6", name: "Schirmlampe" },
        { id: "lamp7", name: "Gitterlampe" }
    ];

    const newRooms = ["Flur 1", "Flur 2", "Wohnzimmer", "Spot Wohnzimmer", "Office Corina", "Schlafzimmer", "Bad oben", "Bad unten", "Toilette oben", "Toilette unten", "Küche", "Office Alex", "Spot Office Alex"];

    function updateOptions() {
        const selects = document.querySelectorAll('select');
        const taken = Array.from(selects).map(s => s.value).filter(v => v && v !== "NEU");

        selects.forEach(select => {
            const current = select.value;
            Array.from(select.options).forEach(opt => {
                if (opt.value !== "" && opt.value !== "NEU") {
                    opt.hidden = taken.includes(opt.value) && opt.value !== current;
                }
            });
        });
    }

    const container = document.getElementById('rooms-container');
    newRooms.forEach((room, i) => {
        const div = document.createElement('div');
        div.className = 'room-item';
        div.innerHTML = `<label>${room}</label>
                         <select class="select" onchange="updateOptions()">
                            <option value="">-- Wählen --</option>
                            <option value="NEU">✨ Neue kaufen</option>
                            ${oldLamps.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}
                         </select>`;
        container.appendChild(div);
    });
</script>
</body>
</html>
