<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projekt Gutenberg eBook-loader</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-color: #212121;
            --heading-color: #212121;
            --accent-color: #B8860B; 
            --accent-hover: #996B00;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --btn-text: #FFFFFF;
            --hover-bg: #F0EBE1;
        }

        [data-theme="dark"] {
            --bg-color: #212121;
            --card-bg: #2A2A2A;
            --text-color: #E0E0E0;
            --heading-color: #FFFFFF;
            --accent-color: #d4af37; 
            --accent-hover: #ffca28;
            --border-color: #404040;
            --input-bg: #333333;
            --btn-text: #212121;
            --hover-bg: #3A3A3A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            color: var(--heading-color);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .action-btn.active-lib {
            background: var(--accent-color);
            color: var(--btn-text);
            border-color: var(--accent-color);
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-color);
            color: var(--btn-text);
            border-color: var(--accent-color);
        }

        /* Suchbereich */
        .search-wrapper {
            margin-bottom: 40px;
        }

        .search-container {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            touch-action: manipulation;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.search-btn {
            padding: 14px 28px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button.search-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Kissing Spinner Animation */
        .kissing-spinner {
            display: none; /* Wird per JS auf flex gesetzt */
            justify-content: center;
            align-items: center;
            margin: 40px auto;
            width: 60px;
            height: 20px;
            position: relative;
        }

        .kiss-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--accent-color);
        }

        .kiss-dot.left {
            left: 0;
            animation: kissLeft 0.6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .kiss-dot.right {
            right: 0;
            background-color: var(--text-color);
            opacity: 0.7;
            animation: kissRight 0.6s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes kissLeft {
            0% { transform: translateX(0) scale(1); border-radius: 50%; }
            100% { transform: translateX(20px) scale(1.1); border-radius: 50% 30% 30% 50%; }
        }

        @keyframes kissRight {
            0% { transform: translateX(0) scale(1); border-radius: 50%; }
            100% { transform: translateX(-20px) scale(1.1); border-radius: 30% 50% 50% 30%; }
        }

        /* Buch-Karten */
        .book-card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            gap: 20px;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .result-cover {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background-color: var(--border-color);
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
        }

        .book-info h3 {
            margin: 0 0 6px 0;
            color: var(--heading-color);
            font-family: 'Bodoni Moda', serif;
            font-size: 1.4rem;
        }

        .book-info p {
            margin: 0 0 12px 0;
            color: var(--text-color);
            opacity: 0.8;
            font-size: 14px;
        }

        .download-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: var(--btn-text);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-cover-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--border-color);
            color: var(--text-color);
            font-size: 10px;
            text-align: center;
            padding: 5px;
        }

        #libraryView {
            display: none;
        }

        .library-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-color);
            opacity: 0.6;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
            .search-container {
                flex-direction: column;
            }
            .book-card {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
            }
            .result-cover {
                width: 120px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Projekt Gutenberg eBook-loader</h1>
        <div class="header-actions">
            <button class="action-btn" onclick="toggleLibrary()" id="libraryBtn">Bibliothek (0)</button>
            <button class="action-btn" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
        </div>
    </div>
    
    <div id="searchView">
        <div class="filter-tabs">
            <button class="filter-btn active" data-lang="de,en" onclick="setLanguage('de,en', this)">Alle</button>
            <button class="filter-btn" data-lang="de" onclick="setLanguage('de', this)">Deutsch</button>
            <button class="filter-btn" data-lang="en" onclick="setLanguage('en', this)">Englisch</button>
        </div>

        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buchtitel oder Autor eingeben..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="searchBooks()">Suchen</button>
            </div>
        </div>

        <!-- Der neue Kissing Spinner -->
        <div class="kissing-spinner" id="loadingSpinner">
            <div class="kiss-dot left"></div>
            <div class="kiss-dot right"></div>
        </div>

        <div id="results"></div>
    </div>

    <div id="libraryView">
        <div class="library-header">
            <h2 style="font-family: 'Bodoni Moda', serif; margin: 0; color: var(--heading-color);">Meine geladenen eBooks</h2>
        </div>
        <div id="libraryResults"></div>
    </div>

    <script>
        let currentLang = 'de,en'; 
        let library = JSON.parse(localStorage.getItem('gutenberg_library')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = 'Dark Mode';
            }
            updateLibraryCount();
        });

        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        function setLanguage(lang, btnElement) {
            currentLang = lang;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            const searchInput = document.getElementById('searchInput');
            if (searchInput.value.trim().length > 0) {
                searchBooks();
            }
        }

        function toggleLibrary() {
            const searchView = document.getElementById('searchView');
            const libraryView = document.getElementById('libraryView');
            const libBtn = document.getElementById('libraryBtn');
            
            if (libraryView.style.display === 'none' || libraryView.style.display === '') {
                searchView.style.display = 'none';
                libraryView.style.display = 'block';
                libBtn.textContent = 'Zurück zur Suche';
                libBtn.classList.add('active-lib');
                renderLibrary();
            } else {
                searchView.style.display = 'block';
                libraryView.style.display = 'none';
                updateLibraryCount();
                libBtn.classList.remove('active-lib');
            }
        }

        function updateLibraryCount() {
            document.getElementById('libraryBtn').textContent = `Bibliothek (${library.length})`;
        }

        function saveToLibrary(bookData) {
            const exists = library.find(b => b.id === bookData.id);
            if (!exists) {
                library.unshift(bookData);
                localStorage.setItem('gutenberg_library', JSON.stringify(library));
                updateLibraryCount();
            }
        }

        function removeFromLibrary(id) {
            library = library.filter(b => b.id !== id);
            localStorage.setItem('gutenberg_library', JSON.stringify(library));
            updateLibraryCount();
            renderLibrary(); 
        }

        function renderLibrary() {
            const libResultsDiv = document.getElementById('libraryResults');
            libResultsDiv.innerHTML = '';

            if (library.length === 0) {
                libResultsDiv.innerHTML = '<div class="empty-state">Noch keine eBooks heruntergeladen. Starte eine Suche!</div>';
                return;
            }

            library.forEach(book => {
                const card = createBookCard(book, true);
                libResultsDiv.appendChild(card);
            });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        }

        const searchInput = document.getElementById('searchInput');

        async function downloadEpubFile(url, title) {
            const safeTitle = title.replace(/[\\/:*?"<>|]/g, '').trim().substring(0, 60);
            const filename = `${safeTitle}.epub`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Netzwerkfehler');
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename; 
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                console.warn('Fetch-Download fehlgeschlagen, nutze Fallback.', error);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename; 
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function createBookCard(book, isLibraryView = false) {
            const card = document.createElement('div');
            card.className = 'book-card';

            const coverImg = document.createElement('img');
            coverImg.className = 'result-cover';
            if (book.coverUrl) {
                coverImg.src = book.coverUrl;
                coverImg.alt = `Cover von ${book.title}`;
            } else {
                coverImg.className += ' no-cover-placeholder';
                coverImg.alt = '';
                coverImg.outerHTML = `<div class="result-cover no-cover-placeholder">Kein Cover</div>`;
            }
            if (book.coverUrl) card.appendChild(coverImg);

            const infoDiv = document.createElement('div');
            infoDiv.className = 'book-info';

            const title = document.createElement('h3');
            title.textContent = book.title;

            const author = document.createElement('p');
            author.textContent = `Von: ${book.authorName}`;

            infoDiv.appendChild(title);
            infoDiv.appendChild(author);

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'download-btn';
            
            if (isLibraryView) {
                downloadBtn.textContent = 'Erneut Laden';
                downloadBtn.onclick = async () => {
                    downloadBtn.textContent = 'Lädt...';
                    downloadBtn.disabled = true;
                    await downloadEpubFile(book.epubLink, book.title);
                    downloadBtn.textContent = 'Erneut Laden';
                    downloadBtn.disabled = false;
                };
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'download-btn';
                removeBtn.style.borderColor = '#E74C3C';
                removeBtn.style.color = '#E74C3C';
                removeBtn.style.marginLeft = '10px';
                removeBtn.textContent = 'Entfernen';
                removeBtn.onclick = () => removeFromLibrary(book.id);
                
                infoDiv.appendChild(downloadBtn);
                infoDiv.appendChild(removeBtn);
            } else {
                downloadBtn.textContent = 'EPUB Laden';
                downloadBtn.onclick = async () => {
                    saveToLibrary(book);
                    downloadBtn.textContent = 'Lädt...';
                    downloadBtn.disabled = true;
                    await downloadEpubFile(book.epubLink, book.title);
                    downloadBtn.textContent = 'EPUB Laden';
                    downloadBtn.disabled = false;
                };
                infoDiv.appendChild(downloadBtn);
            }

            card.appendChild(infoDiv);
            return card;
        }

        async function searchBooks(queryParam = null) {
            const query = queryParam || searchInput.value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingSpinner = document.getElementById('loadingSpinner');

            if (!query) return;

            resultsDiv.innerHTML = '';
            loadingSpinner.style.display = 'flex';

            try {
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}&languages=${currentLang}`);
                const data = await response.json();

                loadingSpinner.style.display = 'none';

                if (data.results.length === 0) {
                    const langText = currentLang === 'de' ? 'deutschen' : (currentLang === 'en' ? 'englischen' : '');
                    resultsDiv.innerHTML = `<p style="text-align: center;">Keine ${langText} Bücher für diesen Suchbegriff gefunden.</p>`;
                    return;
                }

                let foundEpub = false;

                data.results.forEach(apiBook => {
                    const epubLink = apiBook.formats['application/epub+zip'];

                    if (epubLink) {
                        foundEpub = true;
                        const authorName = apiBook.authors.length > 0 ? apiBook.authors[0].name : 'Unbekannter Autor';
                        const coverUrl = apiBook.formats['image/jpeg'] || null;

                        const bookData = {
                            id: apiBook.id,
                            title: apiBook.title,
                            authorName: authorName,
                            epubLink: epubLink,
                            coverUrl: coverUrl
                        };

                        const card = createBookCard(bookData, false);
                        resultsDiv.appendChild(card);
                    }
                });

                if (!foundEpub) {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Bücher gefunden, aber aktuell keine EPUB-Dateien verfügbar.</p>';
                }

            } catch (error) {
                loadingSpinner.style.display = 'none';
                resultsDiv.innerHTML = '<p style="text-align: center; color: red;">Fehler bei der Verbindung zur API.</p>';
                console.error("API Error:", error);
            }
        }
    </script>
</body>
</html>
