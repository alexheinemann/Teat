<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projekt Gutenberg eBook-loader</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-color: #212121;
            --heading-color: #212121;
            --accent-color: #B8860B; 
            --accent-hover: #996B00;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --btn-text: #FFFFFF;
            --hover-bg: #F0EBE1;
        }

        [data-theme="dark"] {
            --bg-color: #212121;
            --card-bg: #2A2A2A;
            --text-color: #E0E0E0;
            --heading-color: #FFFFFF;
            --accent-color: #d4af37; 
            --accent-hover: #ffca28;
            --border-color: #404040;
            --input-bg: #333333;
            --btn-text: #212121;
            --hover-bg: #3A3A3A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            color: var(--heading-color);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        .theme-switch {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .theme-switch:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Suchbereich & Autosuggest */
        .search-wrapper {
            position: relative;
            margin-bottom: 40px;
        }

        .search-container {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            touch-action: manipulation;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.search-btn {
            padding: 14px 28px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button.search-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Autosuggest Dropdown */
        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 350px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--hover-bg);
        }

        .suggestion-cover {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 16px;
            background-color: var(--border-color);
        }

        .suggestion-text h4 {
            margin: 0 0 4px 0;
            font-size: 14px;
            color: var(--heading-color);
        }

        .suggestion-text p {
            margin: 0;
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.7;
        }

        #loading {
            text-align: center;
            color: var(--accent-color);
            font-style: italic;
            display: none;
            margin-bottom: 20px;
        }

        /* Buch-Karten (Suchergebnisse) */
        .book-card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            gap: 20px;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .result-cover {
            width: 80px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background-color: var(--border-color);
            flex-shrink: 0;
        }

        .book-info {
            flex: 1;
        }

        .book-info h3 {
            margin: 0 0 6px 0;
            color: var(--heading-color);
            font-family: 'Bodoni Moda', serif;
            font-size: 1.4rem;
        }

        .book-info p {
            margin: 0 0 12px 0;
            color: var(--text-color);
            opacity: 0.8;
            font-size: 14px;
        }

        .download-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: var(--btn-text);
        }

        .no-cover-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--border-color);
            color: var(--text-color);
            font-size: 10px;
            text-align: center;
            padding: 5px;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .search-container {
                flex-direction: column;
            }
            .book-card {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
            }
            .result-cover {
                width: 120px;
                height: 180px;
            }
            .suggestions-box {
                max-height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Projekt Gutenberg eBook-loader</h1>
        <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
    </div>
    
    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buchtitel oder Autor eingeben..." autocomplete="off">
            <button class="search-btn" onclick="searchBooks()">Suchen</button>
        </div>
        <div class="suggestions-box" id="suggestionsBox"></div>
    </div>

    <div id="loading">Suche in der Datenbank läuft...</div>
    <div id="results"></div>

    <script>
        // Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = 'Dark Mode';
            }
        });

        // Autosuggest Logic
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        let debounceTimeout;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimeout);
            const query = e.target.value.trim();

            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            debounceTimeout = setTimeout(() => fetchSuggestions(query), 400); // 400ms warten
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                suggestionsBox.style.display = 'none';
                searchBooks(searchInput.value);
            }
        });

        // Schließt das Dropdown, wenn man woanders hin klickt
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                suggestionsBox.style.display = 'none';
            }
        });

        async function fetchSuggestions(query) {
            try {
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}&languages=de`);
                const data = await response.json();
                
                suggestionsBox.innerHTML = '';
                
                if (data.results.length === 0) {
                    suggestionsBox.innerHTML = '<div style="padding: 12px 16px; font-size: 14px;">Keine Vorschläge gefunden.</div>';
                } else {
                    // Zeige nur die Top 5 Vorschläge an
                    const topResults = data.results.slice(0, 5);
                    
                    topResults.forEach(book => {
                        const item = document.createElement('div');
                        item.className = 'suggestion-item';
                        
                        const coverUrl = book.formats['image/jpeg'];
                        const coverHtml = coverUrl 
                            ? `<img src="${coverUrl}" class="suggestion-cover" alt="Cover">` 
                            : `<div class="suggestion-cover no-cover-placeholder">Kein Cover</div>`;

                        const authorName = book.authors.length > 0 ? book.authors[0].name : 'Unbekannt';
                        
                        item.innerHTML = `
                            ${coverHtml}
                            <div class="suggestion-text">
                                <h4>${book.title}</h4>
                                <p>${authorName}</p>
                            </div>
                        `;
                        
                        item.addEventListener('click', () => {
                            searchInput.value = book.title;
                            suggestionsBox.style.display = 'none';
                            searchBooks(book.title); // Starte direkte Suche
                        });
                        
                        suggestionsBox.appendChild(item);
                    });
                }
                suggestionsBox.style.display = 'block';
            } catch (error) {
                console.error("Autosuggest Error:", error);
            }
        }

        // Hauptsuche
        async function searchBooks(queryParam = null) {
            const query = queryParam || searchInput.value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            suggestionsBox.style.display = 'none'; // Dropdown verstecken

            if (!query) return;

            resultsDiv.innerHTML = '';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}&languages=de`);
                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Keine deutschen Bücher für diesen Suchbegriff gefunden.</p>';
                    return;
                }

                data.results.forEach(book => {
                    const epubLink = book.formats['application/epub+zip'];

                    if (epubLink) {
                        const card = document.createElement('div');
                        card.className = 'book-card';

                        // Cover Extraktion
                        const coverUrl = book.formats['image/jpeg'];
                        if (coverUrl) {
                            const coverImg = document.createElement('img');
                            coverImg.className = 'result-cover';
                            coverImg.src = coverUrl;
                            coverImg.alt = `Cover von ${book.title}`;
                            card.appendChild(coverImg);
                        } else {
                            const noCover = document.createElement('div');
                            noCover.className = 'result-cover no-cover-placeholder';
                            noCover.textContent = 'Kein Cover verfügbar';
                            card.appendChild(noCover);
                        }

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'book-info';

                        const title = document.createElement('h3');
                        title.textContent = book.title;

                        const author = document.createElement('p');
                        const authorName = book.authors.length > 0 ? book.authors[0].name : 'Unbekannter Autor';
                        author.textContent = `Von: ${authorName}`;

                        const downloadBtn = document.createElement('a');
                        downloadBtn.className = 'download-btn';
                        downloadBtn.href = epubLink;
                        downloadBtn.download = ''; 
                        downloadBtn.textContent = 'EPUB Laden';

                        infoDiv.appendChild(title);
                        infoDiv.appendChild(author);
                        infoDiv.appendChild(downloadBtn);
                        
                        card.appendChild(infoDiv);
                        resultsDiv.appendChild(card);
                    }
                });

                if (resultsDiv.innerHTML === '') {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Bücher gefunden, aber aktuell keine EPUB-Dateien verfügbar.</p>';
                }

            } catch (error) {
                loadingDiv.style.display = 'none';
                resultsDiv.innerHTML = '<p style="text-align: center; color: red;">Fehler bei der Verbindung zur API.</p>';
                console.error("API Error:", error);
            }
        }
    </script>
</body>
</html>
