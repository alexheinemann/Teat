<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Projekt Gutenberg eBook-loader</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Light Mode (Beige / Clean Editorial) */
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-color: #212121;
            --heading-color: #212121;
            --accent-color: #B8860B; /* Dunkleres Gold für Kontrast auf Hell */
            --accent-hover: #996B00;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --btn-text: #FFFFFF;
        }

        [data-theme="dark"] {
            /* Dark Mode (Anthrazit & Gold) */
            --bg-color: #212121;
            --card-bg: #2A2A2A;
            --text-color: #E0E0E0;
            --heading-color: #FFFFFF;
            --accent-color: #d4af37; /* Premium Gold */
            --accent-hover: #ffca28;
            --border-color: #404040;
            --input-bg: #333333;
            --btn-text: #212121;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            color: var(--heading-color);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
        }

        .theme-switch {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .theme-switch:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px; /* Wichtig: Verhindert iOS Zoom auf Mobile */
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, background-color 0.3s ease;
            touch-action: manipulation;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.search-btn {
            padding: 14px 28px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button.search-btn:hover {
            background-color: var(--accent-hover);
        }

        button.search-btn:active {
            transform: scale(0.98);
        }

        #loading {
            text-align: center;
            color: var(--accent-color);
            font-style: italic;
            display: none;
            margin-bottom: 20px;
        }

        .book-card {
            background: var(--card-bg);
            padding: 24px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .book-info h3 {
            margin: 0 0 6px 0;
            color: var(--heading-color);
            font-family: 'Bodoni Moda', serif;
            font-size: 1.4rem;
        }

        .book-info p {
            margin: 0;
            color: var(--text-color);
            opacity: 0.8;
            font-size: 14px;
        }

        .download-btn {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
            margin-left: 20px;
        }

        .download-btn:hover {
            background-color: var(--accent-color);
            color: var(--btn-text);
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .search-container {
                flex-direction: column;
            }
            .book-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .download-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Projekt Gutenberg eBook-loader</h1>
        <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">Light Mode</button>
    </div>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buchtitel oder Autor eingeben..." onkeypress="handleKeyPress(event)">
        <button class="search-btn" onclick="searchBooks()">Suchen</button>
    </div>

    <div id="loading">Suche in der Datenbank läuft...</div>
    <div id="results"></div>

    <script>
        // Theme Toggle Funktionalität
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Gespeichertes Theme beim Laden abrufen
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeBtn').textContent = 'Dark Mode';
            }
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        }

        async function searchBooks() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            if (!query) return;

            resultsDiv.innerHTML = '';
            loadingDiv.style.display = 'block';

            try {
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}&languages=de`);
                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Keine deutschen Bücher für diesen Suchbegriff gefunden.</p>';
                    return;
                }

                data.results.forEach(book => {
                    const epubLink = book.formats['application/epub+zip'];

                    if (epubLink) {
                        const card = document.createElement('div');
                        card.className = 'book-card';

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'book-info';

                        const title = document.createElement('h3');
                        title.textContent = book.title;

                        const author = document.createElement('p');
                        const authorName = book.authors.length > 0 ? book.authors[0].name : 'Unbekannter Autor';
                        author.textContent = `Von: ${authorName}`;

                        infoDiv.appendChild(title);
                        infoDiv.appendChild(author);

                        const downloadBtn = document.createElement('a');
                        downloadBtn.className = 'download-btn';
                        downloadBtn.href = epubLink;
                        downloadBtn.download = ''; 
                        downloadBtn.textContent = 'EPUB Laden';

                        card.appendChild(infoDiv);
                        card.appendChild(downloadBtn);
                        resultsDiv.appendChild(card);
                    }
                });

                if (resultsDiv.innerHTML === '') {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Bücher gefunden, aber aktuell keine EPUB-Dateien verfügbar.</p>';
                }

            } catch (error) {
                loadingDiv.style.display = 'none';
                resultsDiv.innerHTML = '<p style="text-align: center; color: red;">Fehler bei der Verbindung zur API.</p>';
                console.error("API Error:", error);
            }
        }
    </script>
</body>
</html>
