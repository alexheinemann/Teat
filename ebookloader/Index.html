<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutenberg EPUB Suche</title>
    <style>
        :root {
            --primary: #2C3E50;
            --secondary: #34495E;
            --accent: #3498DB;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #2980B9;
        }

        button:active {
            transform: scale(0.98);
        }

        #loading {
            text-align: center;
            color: var(--secondary);
            font-style: italic;
            display: none;
        }

        .book-card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .book-info h3 {
            margin: 0 0 8px 0;
            color: var(--primary);
        }

        .book-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        .download-btn {
            background-color: #27AE60;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            white-space: nowrap;
            margin-left: 20px;
        }

        .download-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <h1>Gutenberg EPUB Finder</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buchtitel oder Autor eingeben..." onkeypress="handleKeyPress(event)">
        <button onclick="searchBooks()">Suchen</button>
    </div>

    <div id="loading">Suche in der Gutenberg-Datenbank läuft...</div>
    <div id="results"></div>

    <script>
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchBooks();
            }
        }

        async function searchBooks() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            if (!query) return;

            // UI zurücksetzen
            resultsDiv.innerHTML = '';
            loadingDiv.style.display = 'block';

            try {
                // Gutendex API aufrufen (gefiltert auf Deutsch)
                const response = await fetch(`https://gutendex.com/books/?search=${encodeURIComponent(query)}&languages=de`);
                const data = await response.json();

                loadingDiv.style.display = 'none';

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Keine deutschen Bücher für diesen Suchbegriff gefunden.</p>';
                    return;
                }

                data.results.forEach(book => {
                    // Prüfen, ob ein EPUB-Format existiert
                    const epubLink = book.formats['application/epub+zip'];

                    if (epubLink) {
                        const card = document.createElement('div');
                        card.className = 'book-card';

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'book-info';

                        const title = document.createElement('h3');
                        title.textContent = book.title;

                        const author = document.createElement('p');
                        const authorName = book.authors.length > 0 ? book.authors[0].name : 'Unbekannter Autor';
                        author.textContent = `Von: ${authorName}`;

                        infoDiv.appendChild(title);
                        infoDiv.appendChild(author);

                        const downloadBtn = document.createElement('a');
                        downloadBtn.className = 'download-btn';
                        downloadBtn.href = epubLink;
                        downloadBtn.download = ''; // Suggeriert dem Browser, die Datei herunterzuladen statt sie zu öffnen
                        downloadBtn.textContent = 'EPUB Laden';

                        card.appendChild(infoDiv);
                        card.appendChild(downloadBtn);
                        resultsDiv.appendChild(card);
                    }
                });

                if (resultsDiv.innerHTML === '') {
                    resultsDiv.innerHTML = '<p style="text-align: center;">Bücher gefunden, aber aktuell keine EPUB-Dateien verfügbar.</p>';
                }

            } catch (error) {
                loadingDiv.style.display = 'none';
                resultsDiv.innerHTML = '<p style="text-align: center; color: red;">Fehler bei der Verbindung zur Gutenberg-API.</p>';
                console.error("API Error:", error);
            }
        }
    </script>
</body>
</html>
